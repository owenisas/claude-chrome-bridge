<!DOCTYPE html>
<!--
  Local side panel.

  Styled with the extension's own design tokens: the stylesheets are injected by
  apply-patches.py (see the CCB_STYLES placeholder) and the theme is activated
  with the same data-theme/data-mode pair the stock panel uses, so the palette,
  the Anthropic Sans/Mono faces and the serif response face all come from the
  bundle rather than being approximated.

  Both pickers are chip + menu rather than <select>, because a native select
  renders the OS menu, which looks nothing like the original panel.
-->
<html lang="en" data-theme="claude" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude in Chrome — local bridge</title>
<!--CCB_STYLES-->
<style>
  * { box-sizing: border-box; }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: hsl(var(--bg-100));
    color: hsl(var(--text-100));
    font-family: var(--font-ui, var(--font-anthropic-sans, system-ui, sans-serif));
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }

  /* ---------------------------------------------------------------- header */
  header {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 12px;
    border-bottom: 1px solid hsl(var(--bg-400));
    flex: none;
  }
  .brand { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .brand svg { flex: none; color: #d97757; }
  .brand .name { font-weight: 560; letter-spacing: -.01em; white-space: nowrap; }
  .spacer { flex: 1; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: hsl(var(--text-500)); flex: none; }
  .dot.on { background: #7fb069; }
  .dot.off { background: #e07a5f; }

  /* --------------------------------------------------------------- pickers */
  .wrap { position: relative; display: inline-flex; min-width: 0; }
  .picker {
    appearance: none; border: 0; background: transparent; font: inherit;
    color: hsl(var(--text-400)); cursor: pointer; border-radius: 8px;
    display: inline-flex; align-items: center; gap: 3px;
    padding: 3px 5px; max-width: 168px; min-width: 0;
  }
  .picker:hover { background: hsl(var(--bg-300)); color: hsl(var(--text-100)); }
  .picker[aria-expanded="true"] { background: hsl(var(--bg-300)); color: hsl(var(--text-100)); }
  .picker:focus-visible { outline: none; box-shadow: 0 0 0 1.5px hsl(var(--text-500)); }
  .picker .label { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .picker.composer-picker .label { font-size: 12.5px; }
  .caret { flex: none; opacity: .75; }

  .menu {
    position: absolute; z-index: 20; min-width: 168px;
    background: hsl(var(--bg-000));
    border: 1px solid hsl(var(--bg-400));
    border-radius: 12px; padding: 4px;
    box-shadow: 0 10px 30px hsl(0 0% 0% / .45), 0 2px 6px hsl(0 0% 0% / .3);
    display: flex; flex-direction: column; gap: 1px;
  }
  .menu[hidden] { display: none; }
  .menu.up { bottom: calc(100% + 7px); left: 0; }
  .menu.down { top: calc(100% + 7px); right: 0; }
  .item {
    display: flex; align-items: center; gap: 7px;
    padding: 6px 8px; border-radius: 8px; cursor: pointer;
    color: hsl(var(--text-300)); font-size: 13px; white-space: nowrap;
    background: transparent; border: 0; font-family: inherit; text-align: left; width: 100%;
  }
  .item:hover, .item:focus-visible { background: hsl(var(--bg-300)); color: hsl(var(--text-100)); outline: none; }
  .item[aria-selected="true"] { color: hsl(var(--text-100)); }
  .item .check { flex: none; width: 12px; opacity: 0; color: hsl(var(--text-100)); }
  .item[aria-selected="true"] .check { opacity: 1; }
  .item .sub { color: hsl(var(--text-500)); font-size: 11px; margin-left: auto; }

  /* ------------------------------------------------------------------ meta */
  .meta {
    display: flex; gap: 8px; align-items: baseline;
    padding: 7px 12px; border-bottom: 1px solid hsl(var(--bg-400));
    font-size: 12px; color: hsl(var(--text-500)); flex: none; flex-wrap: wrap;
  }
  .meta .k { color: hsl(var(--text-500)); min-width: 54px; }
  .chips { display: inline-flex; flex-wrap: wrap; gap: 4px; }
  .chip {
    border: 1px solid hsl(var(--bg-400)); border-radius: 999px;
    padding: 0 7px; font-size: 11px; color: hsl(var(--text-400));
  }
  .chip.warn { border-color: #6b4a3a; color: #e0a07f; }

  /* ------------------------------------------------------------------- log */
  #log { flex: 1; overflow-y: auto; padding: 16px 14px 8px; display: flex; flex-direction: column; gap: 14px; }
  #log::-webkit-scrollbar { width: 8px; }
  #log::-webkit-scrollbar-thumb { background: hsl(var(--bg-400)); border-radius: 4px; }

  .me { align-self: flex-end; max-width: 88%; background: hsl(var(--bg-300));
        border-radius: 14px; padding: 7px 12px; white-space: pre-wrap; word-wrap: break-word; }
  .bot {
    align-self: stretch;
    font-family: var(--font-claude-response, var(--font-anthropic-serif, Georgia, serif));
    font-size: 14.5px; line-height: 1.62;
  }
  .bot p { margin: 0 0 9px; } .bot p:last-child { margin-bottom: 0; }
  .bot strong { font-weight: 600; }
  .bot code { font-family: var(--font-anthropic-mono, ui-monospace, monospace); font-size: 12px;
              background: hsl(var(--bg-300)); border-radius: 4px; padding: 1px 5px; }
  .bot ul { margin: 0 0 9px; padding-left: 20px; }
  .bot li { margin: 2px 0; }
  .note { align-self: center; text-align: center; color: hsl(var(--text-500)); font-size: 12px; max-width: 92%; }
  .tools { display: flex; flex-wrap: wrap; gap: 4px; }
  .working { color: hsl(var(--text-500)); font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .working::after {
    content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor;
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }

  .ask { border: 1px solid #6b4a3a; background: hsl(var(--bg-300)); border-radius: 12px; padding: 11px 13px; }
  .ask p { margin: 0 0 9px; font-size: 13px; }
  .ask .btns { display: flex; gap: 7px; }
  .ask .btns .primary { background: hsl(var(--text-100)); color: hsl(var(--bg-000)); border-color: transparent; font-weight: 560; }

  /* -------------------------------------------------------------- composer */
  footer { flex: none; padding: 10px 12px 12px; }
  .composer {
    border: 1px solid hsl(var(--bg-400)); background: hsl(var(--bg-000));
    border-radius: 16px; padding: 9px 10px 7px;
    display: flex; flex-direction: column; gap: 6px;
    transition: border-color .12s ease;
  }
  .composer:focus-within { border-color: hsl(var(--text-500)); }
  #input {
    width: 100%; border: 0; outline: none; resize: none; background: transparent;
    color: hsl(var(--text-100)); font: inherit; font-size: 14px; line-height: 1.5;
    max-height: 150px; min-height: 24px; padding: 1px 2px;
  }
  #input::placeholder { color: hsl(var(--text-500)); }
  .row { display: flex; align-items: center; gap: 8px; }
  .send {
    appearance: none; border: 0; cursor: pointer; flex: none;
    width: 28px; height: 28px; border-radius: 50%;
    background: hsl(var(--bg-500)); color: hsl(var(--text-200));
    display: grid; place-items: center; transition: background .12s ease;
  }
  .send:hover:not(:disabled) { background: hsl(var(--text-100)); color: hsl(var(--bg-000)); }
  .send:disabled { opacity: .45; cursor: default; }

  .ctl {
    appearance: none; background: transparent; color: hsl(var(--text-400));
    border: 1px solid hsl(var(--bg-400)); border-radius: 8px;
    font: inherit; font-size: 12px; padding: 4px 8px; cursor: pointer;
  }
  .ctl:hover { background: hsl(var(--bg-300)); color: hsl(var(--text-100)); }
</style>
</head>
<body>
  <header>
    <span class="brand">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 1.6c.35 3.9 1.2 6.6 2.6 8 1.4 1.4 4.1 2.25 8 2.6-3.9.35-6.6 1.2-8 2.6-1.4 1.4-2.25 4.1-2.6 8-.35-3.9-1.2-6.6-2.6-8-1.4-1.4-4.1-2.25-8-2.6 3.9-.35 6.6-1.2 8-2.6 1.4-1.4 2.25-4.1 2.6-8Z"/>
      </svg>
      <span class="name">Claude in Chrome</span>
    </span>
    <span class="spacer"></span>
    <span class="dot" id="dot" title="bridge connection"></span>
    <span class="wrap">
      <button class="picker" id="pick-btn" aria-haspopup="listbox" aria-expanded="false" title="Which browser this panel drives">
        <span class="label" id="pick-label">browser</span>
        <svg class="caret" width="9" height="9" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg>
      </button>
      <div class="menu down" id="pick-menu" role="listbox" hidden></div>
    </span>
    <button class="ctl" id="refresh" title="Re-read bridge status" style="padding:4px 7px;line-height:1">&#8635;</button>
  </header>

  <div class="meta">
    <span class="k">Allowed</span><span class="chips" id="allow">…</span>
    <span class="spacer"></span>
    <span class="k" style="min-width:0">Blocked</span><span id="approvals">…</span>
  </div>

  <div id="log">
    <div class="note">Local bridge — turns run through your Claude Code login. No Claude account login, no extension relay, and every host still passes the allowlist.</div>
  </div>

  <footer>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Ask for something the browser should do…"></textarea>
      <div class="row">
        <span class="wrap">
          <button class="picker composer-picker" id="model-btn" aria-haspopup="listbox" aria-expanded="false" title="Model for this panel">
            <span class="label" id="model-label">Default model</span>
            <svg class="caret" width="9" height="9" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg>
          </button>
          <div class="menu up" id="model-menu" role="listbox" hidden></div>
        </span>
        <span class="spacer"></span>
        <button class="send" id="send" title="Send (Enter)" aria-label="Send">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 13V3M3.6 7.4 8 3l4.4 4.4"/>
          </svg>
        </button>
      </div>
    </div>
  </footer>

  <script src="local-panel.js"></script>
</body>
</html>
